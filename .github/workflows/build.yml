name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The repo ships unit tests (slides, text-search, watcher, rtl-direction and
  # the hljs dark-theme coverage guard) but nothing ran them, so a regression in
  # any of them reached main unnoticed.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10.34.7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install

      - name: Unit tests
        run: pnpm test

      # Blocking. svelte-check reports clean as of the commit that removed
      # continue-on-error here; with it, the step could never fail the job but
      # still left a red "exit code 1" annotation on every green run.
      - name: Type check
        run: pnpm check

  # `tauri build` never compiles #[cfg(test)] code, so Rust tests would be
  # carried along without ever being built. Separate job because it needs the
  # Linux GUI dependencies and a frontend build.
  rust-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10.34.7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # tauri-build validates that frontendDist (../build) exists, so the
      # frontend has to be built before cargo touches the crate.
      - name: Build frontend
        run: pnpm install && pnpm build

      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test

  build:
    # Personal releases follow the project release skill; no automatic uploads.
    if: github.repository == 'vaibhav-kakde-in/mdhero'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macOS
          - platform: windows-latest
            name: Windows
          - platform: windows-11-arm
            name: Windows 11 ARM
          - platform: ubuntu-22.04
            name: Linux
          - platform: ubuntu-22.04-arm
            name: Linux arm64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10.34.7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xdg-utils

      - name: Install frontend dependencies
        run: pnpm install

      # Apple signing/notarization only runs for push-to-main and tag builds,
      # not for pull_request events. Fork PRs don't have access to the upstream
      # repo's secrets, and same-repo PRs don't need to produce signed
      # artifacts — they just need to verify the code compiles.
      - name: Import Apple certificate
        if: matrix.platform == 'macos-latest' && github.event_name != 'pull_request'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 12)

          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      # Notarization credentials are set via $GITHUB_ENV so they're completely
      # absent on PR builds. Setting them inline in the Build step's env: block
      # to '' (empty string) was being treated by Tauri as "present, attempt
      # notarization, validate Team ID, fail" — instead we want "absent, skip
      # notarization entirely." On non-PR events the secrets land in env
      # normally and Tauri performs the full notarize-then-staple flow.
      - name: Configure notarization credentials
        if: matrix.platform == 'macos-latest' && github.event_name != 'pull_request'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          {
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> $GITHUB_ENV

      # Must run BEFORE tauri-action. Tauri copies the finished .appex into the
      # app bundle and seals it inside the app's signature, but it does NOT sign
      # what it copies — custom files are added after the bundler has collected
      # its signing targets. An unsigned nested extension fails
      # `codesign --verify --deep` and notarization, so it is signed here first.
      - name: Build the Quick Look extension
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_SIGNING_IDENTITY: ${{ github.event_name == 'pull_request' && '-' || secrets.APPLE_SIGNING_IDENTITY }}
        run: ./quicklook/build-appex.sh

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # On macOS PR builds, fall back to ad-hoc identity ("-") so codesign
          # has SOMETHING to sign with — tauri.conf.json's signingIdentity is
          # null (real identity comes from env on releases), and an empty env
          # var leaves codesign with no identity at all, which fails the build.
          # APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID are not set here —
          # they're populated via $GITHUB_ENV in the previous step only on
          # non-PR events. See the comment on that step for why empty strings
          # don't work as a "skip notarization" signal.
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && (github.event_name == 'pull_request' && '-' || secrets.APPLE_SIGNING_IDENTITY) || '' }}
          # Updater signing key — present only on non-PR builds (fork PRs can't
          # access secrets). createUpdaterArtifacts is enabled via the release
          # config overlay below, also non-PR only, so the two always line up:
          # a build either creates signed updater artifacts (key + overlay) or
          # creates none (PR). It never tries to create unsigned ones, which
          # Tauri would reject.
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name != 'pull_request' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          # On non-PR builds, merge the overlay that turns on
          # bundle.createUpdaterArtifacts (signed .tar.gz/.sig + latest.json).
          # Kept out of the base config so PR builds don't try to sign updater
          # artifacts without a key.
          # Two overlays, both conditional:
          #   release   — turns on signed updater artifacts (non-PR only)
          #   quicklook — embeds MDHeroQuickLook.appex at Contents/PlugIns
          # The quicklook overlay is kept out of the base config so that a plain
          # `pnpm tauri build` on a machine that has not built the extension
          # still works; the bundler errors if a file in bundle.macOS.files is
          # missing.
          args: >-
            ${{ github.event_name != 'pull_request' && '--config src-tauri/tauri.release.conf.json' || '' }}
            ${{ matrix.platform == 'macos-latest' && '--config src-tauri/tauri.quicklook.conf.json' || '' }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('MDHero {0}', github.ref_name) || '' }}
          releaseBody: |
            See the full changelog in the [commit history](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}).

            ## Install
            - **macOS** (Apple Silicon): Download the `.dmg` file
            - **Windows** (x64 or ARM64): Download the `.msi` installer or `-setup.exe` (NSIS) — pick the `x64` or `arm64` file for your machine
            - **Linux** (x64 or arm64): Download the `.deb` (Debian/Ubuntu), `.rpm` (Fedora/openSUSE) or `.AppImage` (any distro) — `amd64`/`x86_64` or `arm64`/`aarch64`
          # Built as a DRAFT and published by the `publish` job below, once
          # every platform has succeeded. See that job for why.
          releaseDraft: true
          prerelease: false

      # Tauri notarizes and staples the .app, then wraps the stapled app in a
      # .dmg — but it never submits the .dmg itself. The disk image therefore
      # ships signed but unnotarized, and Gatekeeper rejects it the first time
      # anyone opens the download (#116). The app inside is unaffected, so this
      # is purely the first-open moment for a new user — on the most downloaded
      # asset we publish.
      #
      # This runs after tauri-action because tauri-action both builds AND
      # uploads, so the notarized copy has to replace the one it already
      # attached — to the DRAFT release, which nobody can see yet. Secrets are
      # consumed by notarytool, never emitted.
      - name: Notarize and staple the .dmg
        if: matrix.platform == 'macos-latest' && startsWith(github.ref, 'refs/tags/')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(src-tauri/target/release/bundle/dmg/*.dmg)
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "::error::no .dmg was produced — nothing to notarize"
            exit 1
          fi
          for dmg in "${dmgs[@]}"; do
            echo "==> notarizing $(basename "$dmg")"
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "$dmg"

            # Prove it rather than assume it: a stapled ticket and a Gatekeeper
            # accept are the two things #116 measured as missing. Failing here
            # is better than shipping another unnotarized image.
            xcrun stapler validate "$dmg"
            spctl -a -vvv -t open --context context:primary-signature "$dmg"

            echo "==> replacing the copy tauri-action attached to the draft"
            gh release upload "$GITHUB_REF_NAME" "$dmg" --clobber
          done

      - name: Clean up keychain
        if: always() && matrix.platform == 'macos-latest' && github.event_name != 'pull_request'
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db

      - name: Upload artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v6
        with:
          name: mdhero-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore

  # The release is assembled as a draft and only becomes public here, after
  # every platform has succeeded AND every expected asset is actually present.
  #
  # Before this job existed, tauri-action published immediately and the macOS
  # notarization step ran afterwards. So any notarization failure — Apple
  # rejects the submission, the credentials expire, the notary service is down —
  # left a PUBLIC release carrying an unnotarized .dmg, which is the exact
  # defect #116 reported. Draft-then-promote makes that unreachable: anything
  # that fails leaves the release invisible, and a human decides what to do.
  publish:
    needs: build
    if: github.repository == 'vaibhav-kakde-in/mdhero' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Verify the draft is complete, then publish it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"

          assets=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name')
          echo "assets on the draft:"
          printf '%s\n' "$assets" | sed 's/^/  /'

          # Five green ticks do not mean five platforms produced files: an
          # upload step with `if-no-files-found: ignore` passes cheerfully while
          # producing nothing. Assert presence per platform instead of inferring
          # it. Anything missing leaves the release a draft.
          missing=0
          for pat in '[.]dmg$' 'app[.]tar[.]gz$' 'app[.]tar[.]gz[.]sig$' \
                     '[.]msi$' '[-]setup[.]exe$' '[.]deb$' '[.]rpm$' \
                     '[.]AppImage$' '^latest[.]json$'; do
            if ! printf '%s\n' "$assets" | grep -qE "$pat"; then
              echo "::error::no asset matches /$pat/ — leaving $tag as a draft"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "published $tag"
