name: Prepare privacy-checked Windows release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10.34.7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - name: Build and inspect installer
        id: package
        run: pnpm release:prepare
      - name: Upload only the verified package
        uses: actions/upload-artifact@v6
        with:
          name: privacy-checked-windows-x64
          path: ${{ steps.package.outputs.directory }}/
          if-no-files-found: error
